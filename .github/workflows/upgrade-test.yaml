name: ZKsync OS Upgrade Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-test:
    runs-on: matterlabs-ci-runner-high-performance
    timeout-minutes: 120
    env:
      UPGRADE_VERSION: v31-interop-b
      UPGRADE_FILE_EXTENSION: v31
      DEBIAN_FRONTEND: noninteractive
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libclang-dev \
            libssl-dev \
            pkg-config \
            jq \
            wget \
            curl

      - name: Install Rust toolchain
        uses: moonrepo/setup-rust@v1
        with:
          channel: nightly-2025-05-23
          inherit-toolchain: true
          bins: cargo-nextest
          cache: false

      - name: Install Foundry
        run: |
          mkdir -p foundry
          curl -LO https://github.com/foundry-rs/foundry/releases/download/v1.5.1/foundry_v1.5.1_linux_amd64.tar.gz
          tar zxf foundry_v1.5.1_linux_amd64.tar.gz -C ./foundry
          chmod +x ./foundry/*
          echo "${PWD}/foundry" >> "${GITHUB_PATH}"

      - name: Install Foundry-ZKsync
        uses: dutterbutter/foundry-zksync-toolchain@v1
        with:
          version: v0.1.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install zkstack
        run: |
          cd zksync-era
          ./zkstack_cli/zkstackup/install --path ./zkstack_cli/zkstackup/zkstackup
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          zkstackup --local || true
          zkstack --version
          cd ..

      - name: Build zksync-os-server
        run: |
          cd zksync-os-server
          cargo build --release
          echo "Built zksync-os-server at: ${PWD}/target/release/zksync-os-server"

      - name: Start zksync-os-server on v30.2 chain
        run: |
          cd zksync-os-server
          rm -rf db/*
          ./target/release/zksync-os-server \
            --config ./local-chains/v30.2/default/config.yaml \
            &> ../zksync-os-server-v30.log &
          echo $! > /tmp/zksync_os_server.pid
          sleep 10
          echo "ZKsync OS Server started on v30.2"

      - name: Stop v30.2 server before upgrade
        run: |
          kill -9 $(cat /tmp/zksync_os_server.pid) || true
          sleep 2

      - name: Run upgrade test
        run: |
          # Test automatically starts and manages Anvil L1 node
          cargo test --test upgrade-tests test_v30_to_v31_upgrade -- --ignored --nocapture

      - name: Restart zksync-os-server after upgrade
        run: |
          cd zksync-os-server
          ./target/release/zksync-os-server \
            --config ./local-chains/v30.2/default/config.yaml \
            &> ../zksync-os-server-final.log &
          echo $! > /tmp/zksync_os_server_final.pid
          sleep 10
          echo "ZKsync OS Server restarted after upgrade"

      - name: Verify upgrade with test transaction
        run: |
          cargo test --test upgrade-tests test_post_upgrade_verification -- --ignored --nocapture

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-test-logs
          path: |
            zksync-os-server-v30.log
            zksync-os-server-final.log
            zksync-era/contracts/l1-contracts/broadcast/**/*
            zksync-era/contracts/l1-contracts/script-out/**/*

      - name: Cleanup
        if: always()
        run: |
          kill -9 $(cat /tmp/zksync_os_server_final.pid) 2>/dev/null || true
          kill -9 $(cat /tmp/zksync_os_server.pid) 2>/dev/null || true
          # Anvil is managed by the test and automatically cleaned up
